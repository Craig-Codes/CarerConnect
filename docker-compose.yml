# Docker compose orcestrates the spinning up of multiple containers
# Each service is a container
services:
  carer_connect_frontend:
    container_name: carer_connect_frontend
    build:
      context: ./CarerConnect_frontend
      dockerfile: Dockerfile
      # Map the internal app port, to the exposed container port.
      #  Traffic entering port 8080 is directed to 8080 for the app in the container
    ports:
      - "8080:8080"
    volumes:
      - ./CarerConnect_frontend:/app # Bind mount for code hot reloading
      - /app/node_modules # unammed volume for node_modules ensures modules are installed based on containers operating system
    environment:
      - NODE_ENV=development

  carer_connect_backend:
    container_name: carer_connect_backend
    build:
      context: ./CarerConnect_backend
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./CarerConnect_backend:/app # Bind mount for code hot reloading
      - /app/node_modules # unammed volume for node_modules ensures modules are installed based on containers operating system
    environment:
      - NODE_ENV=development
    depends_on:
      # This stops the backend container from starting until the database is spun up
      # This prevents connection issues when the database can't be found
      carer_connect_database:
        condition: service_healthy

  # The rest of th services are pre-built, with the images taken directly from dockerhub
  # These are official containers, supported and maintained by the creators of the services
  carer_connect_database:
    image: postgres:16
    restart: unless-stopped
    container_name: database
    env_file: .env
    ports:
      - "5432:5432"
    environment:
      # Variables taken from root level .env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: pg-admin
    env_file: .env
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    depends_on:
      - carer_connect_database

volumes:
  postgres_data: {} # Named volume to store database data
